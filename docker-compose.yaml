services:
  seed:
    build: .
    image: emporio-da-musica:latest
    command: ["uv", "run", "python", "scripts/seed_database.py"]
    environment:
      DATABASE_PATH: /app/database/emporio.db
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - database:/app/database

  mcp-server:
    build: .
    image: emporio-da-musica:latest
    command: ["uv", "run", "python", "-m", "mcp_server.server"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      DATABASE_PATH: /app/database/emporio.db
      CHROMA_PERSIST_DIR: /app/chroma
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-policy_manual}
      DATA_DIR: /app/data
      POLICY_PDF_PATH: /app/data/políticas_da_loja.pdf
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MAX_CHUNK_CHARS: ${RAG_MAX_CHUNK_CHARS:-1200}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-150}
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - database:/app/database:ro
      - chroma:/app/chroma
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 300s

  backend:
    build: .
    image: emporio-da-musica:latest
    command: ["uv", "run", "python", "-m", "backend.main"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build: .
    image: emporio-da-musica:latest
    command:
      - uv
      - run
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  database:
  chroma:
